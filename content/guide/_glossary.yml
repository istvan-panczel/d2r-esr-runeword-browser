- term: Stocker
  definition: A container item that destroys the materials you cube into it and stores them as points you can take out later.
  note: stockers
- term: Multi Stocker
  definition: The general stocker for organs, Dragon Stones, Decipherers, coupons, Maple Leaves and more; also turns spare set and unique gear into Decipherer points.
  note: stockers
- term: Rerolling Orb
  definition: A stocker for rings, amulets, jewels, charms and quivers that stores them as points by rarity and rerolls them into new ones.
  note: stockers
- term: Ancient Coupon
  definition: A drop that names one vanilla (LoD) unique; matching coupons, alone or with Wild Cards, cube into that unique.
  note: coupons
- term: Wild Card
  definition: A joker made from spare coupons that stands in for the third matching coupon in unique recipes (higher tiers need more of them) and appears in several gem recipes.
  note: coupons
- term: Coupon reroll
  definition: Cubing spare coupons with a Randomizing Stone to get a random coupon of the same or the next tier.
  note: coupons
- term: Ancient Scroll
  definition: A numbered scroll (1 to 50) that unlocks the Secret Recipe with the same number; it is returned after each use.
  note: secret-recipes
- term: Ancient Decipherer
  definition: A common material that identifies Ancient Scrolls and feeds many recipes; eight make a Dragon Stone.
  note: secret-recipes
- term: Secret Recipe
  definition: One of the numbered cube recipes that only work with the matching identified Ancient Scroll in the cube.
  note: secret-recipes
- term: Dragon Stone
  definition: The main crafting stone of ESR, used for D-stoning, class crafts, many Secret Recipes and Anvil Stones.
  note: dragon-stones
- term: Dragon Stone forms
  definition: The shapes a Dragon Stone cycles through when cubed alone (Holy Symbol, Blackmoor, Forging Hammer, Crushed Gem, Spider's Silk, Tyranium Ore, Void Shard); each is a different ingredient.
  note: dragon-stones
- term: Anvil Stone
  definition: A stronger crafting stone made from Dragon Stones and a Perfect Gem; the main cost of Skill and Stat Forging.
  note: dragon-stones
- term: Forging
  definition: A cube recipe that adds one extra, removable bonus to an item; an item holds one Forging at a time.
  note: forging
- term: Thawing Potion
  definition: A potion used, three at a time, to remove a Forging from an item; it also appears in key and charm recipes.
  note: forging
- term: D-stoning
  definition: Cubing an item with a Dragon Stone form to add a small permanent stat at the cost of a higher level requirement.
  note: dstoning-and-mapling
- term: Gem melding
  definition: Cubing an item with a Perfect Gem and Decipherers to add that gem's chipped bonus permanently, raising the level requirement.
  note: dstoning-and-mapling
- term: Maple Leaf
  definition: A material made mainly from spare unique charms; spent on Mapling, All Skill Forging and several high-end recipes.
  note: dstoning-and-mapling
- term: Mapling
  definition: Secret Recipe 50, which spends a Maple Leaf and a Perfect Gem to lower an item's level requirement penalty so it can be D-stoned again.
  note: dstoning-and-mapling
- term: Tinkering
  definition: Cubing gear with organs to add small permanent bonuses, limited by the tinkering points shown on each item.
  note: tinkering
- term: Corruption
  definition: Cubing an item with a Worldstone Shard for a random strong bonus, with a chance to turn the item into a random rare.
  note: corruption-anointment
- term: Anointment
  definition: A random bonus added with an Orb of Anointment (non-unique, non-runeword gear) or the three Demonic organs of the Prime Evils (unique charms); it cannot brick the item.
  note: corruption-anointment
- term: Sanctify
  definition: Using Lucion's Relic of Sanctification on a jewel (since 3.3 also a ring or amulet) for a one-time bonus that cannot be undone.
  note: enhancement-order
- term: Branded
  definition: A modifier on the copy that Inarius' Everburning Halo makes of an item (the original comes back unchanged); a Branded item can no longer be changed by any recipe.
  note: enhancement-order
- term: Blemished gem
  definition: An ESR gem grade between Flawless and Perfect, used for rare rerolls, sockets on elite white bases and on exceptional items that are not white, and Ascendancy Stones.
  note: gems-crystals
- term: Crystal
  definition: One of twelve ESR socketable minerals (such as Frozen Soul or Pulsing Opal) in Chipped, Flawed and normal grades.
  note: gems-crystals
- term: Organ
  definition: Monster parts (Hearts, Souls, Brains, Eyes, Scalps, Horns, Fangs, Jawbones, Spleens, Quills, Tails) used for tinkering, the Vessel of Souls and conversions.
  note: loot-triage
- term: ES rune
  definition: ESR's own rune line, named after Japanese syllables from I up to Wo; used in ESR runewords, Rune Forging and many recipes.
  note: rune-families
- term: Decal
  definition: A drop that, cubed with the ES rune named on it, becomes the vanilla (LoD) rune named on it.
  note: rune-families
- term: LoD rune
  definition: A vanilla rune (El to Zod), built from a Decal and an ES rune; used in the reworked vanilla runewords.
  note: rune-families
- term: Null Rune
  definition: A rune made from a Wo Rune and a Full Rejuvenation Potion; the base for every Kanji rune.
  note: rune-families
- term: Kanji rune
  definition: One of ESR's top socketables (Moon, Fire, Water up to God), made from a Null Rune and crystals.
  note: rune-families
- term: Gemword
  definition: A runeword-like recipe that uses gems instead of runes in a socketed white item or charm.
  note: runewords-gemwords
- term: Socket Donut
  definition: The cube ingredient that adds sockets to an item, together with gems whose grade matches the item tier.
  note: socketing
- term: Character Augmenter
  definition: A unique large charm that the official cube page lists in the Starter Pack; the 3.2.12 game files give no way to get one.
  note: starter-pack
- term: Noob's Odd Charm
  definition: The one-socket charm from the Starter Pack; Secret Recipe 49 turns it into a Veteran's Odd Charm.
  note: noobs-charm
- term: Kill Ledger
  definition: A book from the Starter Pack that counts kills and takes permanent bonuses at kill milestones and after endgame boss kills.
  note: kill-ledger
- term: Terror zone
  definition: An area currently terrorized, with stronger monsters; terrorized champions and uniques can drop Worldstone Shards, and terrorized superuniques and act bosses at monster level 96 can drop Endgame Maps. Since 3.3 every zone belongs to a terror group, and each group includes one Endgame Map.
  note: endgame-roadmap
- term: Endgame map
  definition: A consumable item that, transmuted alone in Act 5 Hell, opens a high-level zone, most of them with a boss; maps come in five tiers.
  note: maps-keys-ascendancy
- term: Ascendancy
  definition: A subclass specialisation granted by an Ascendancy Stone, upgraded through five tiers of challenges.
  note: ascendancies
- term: Vessel of Souls
  definition: A mythical amulet that you feed organs in the cube to build up bonuses, then turn into a mythical weapon; it is not meant to be worn.
  note: vessel-of-souls
- term: Token of Absolution
  definition: A consumable made from Dragon Stones; right-click it to add one respec to the character's respec counter.
  note: death-and-respec
- term: Mythical unique
  definition: A top-tier unique that only drops in Endgame Maps, some of them from one specific boss.
  note: maps-keys-ascendancy
- term: Weapon mastery
  definition: A removable specialisation applied to a class weapon with an awakened Weapon Mastery Token; it changes how skills work with that weapon.
  note: weapon-mastery
- term: Merc Only Conversion
  definition: A cube recipe that gives a weapon or armor a bonus package only a mercenary can use; three Antidote Potions undo it.
  note: mercenaries-oskills
- term: Oskill
  definition: A skill granted by an item that any class can use, such as the elemental Surges and Brands.
  note: mercenaries-oskills
- term: Class craft
  definition: A cube recipe that turns a magic item, a class's Dragon Stone form, a Perfect Gem and a jewel into crafted gear with that class's skills.
  note: class-crafting
- term: Evil Urn
  definition: A breakable urn that can stand in any area with monsters since 3.2.19 (2%, 4% and 6% of rooms in Normal, Nightmare and Hell); breaking it releases a boss pack whose boss has one extra rare affix.
  note: hell-survival
- term: Deadly Strike
  definition: A chance per hit to multiply the hit's physical damage, ×2 by default; Deadly Strike Damage raises the multiplier. Weapon-mastery crits, Critical Strike and Deadly Strike roll in turn and only one can succeed, so they never stack.
  link: page:/modifiers?kind=deadly-strike
- term: Deadly Strike Damage
  definition: An ESR stat that adds to the ×2 crit multiplier of Deadly Strike, Critical Strike and weapon-mastery crits; +50% makes crits deal ×2.5.
  link: page:/modifiers?kind=critical-damage
- term: Crushing Blow
  definition: A chance on hit to remove a share of the target's current life, melee or ranged; in ESR {fact:crushingBlow.share:monster}% on normal monsters, {fact:crushingBlow.share:unique}% on yellow uniques, {fact:crushingBlow.share:super_unique}% on superuniques, {fact:crushingBlow.share:act_boss}% on act bosses, {fact:crushingBlow.share:player}% on players and {fact:crushingBlow.share:mercenary}% on mercenaries.
  link: page:/modifiers?kind=crushing-blow
- term: Bleed
  definition: ESR's own damage over time, in place of vanilla's Open Wounds; physical hits make the target lose a percent of that hit's physical damage over a few seconds. The strongest bleed wins and it stacks with poison.
  link: page:/modifiers?kind=bleed
- term: Leech
  definition: Life or mana gained from a percent of the physical weapon damage you deal ("Physical Damage Leeched as Life/Mana"; elemental damage does not leech); for players it is divided by {fact:difficulty.LifeStealDivisor:nightmare} and {fact:difficulty.LifeStealDivisor:hell} (life) or {fact:difficulty.ManaStealDivisor:nightmare} and {fact:difficulty.ManaStealDivisor:hell} (mana) in Nightmare and Hell.
  link: page:/modifiers?kind=life-leech
- term: Life on Striking
  definition: An ESR stat that gives flat life (or mana) on every hit that lands, melee or missile; unlike leech it has no difficulty penalty.
  link: page:/modifiers?kind=on-striking
- term: Physical Resist
  definition: ESR's name for "Damage Reduced by %"; cuts physical damage you take, capped at {fact:resist.physicalCap}%, and also weakens Crushing Blow against you.
  link: page:/modifiers?kind=physical-resist
- term: Resistance penalty
  definition: The amount Nightmare and Hell subtract from your fire, cold, lightning and poison resistances; in ESR {fact:difficulty.ResistPenalty:nightmare} and {fact:difficulty.ResistPenalty:hell}.
  note: hell-survival
  link: page:/modifiers?kind=resist-fire
- term: Maximum resist
  definition: Raises one element's {fact:resist.maxBase}% resistance cap, up to a hard ceiling of {fact:resist.hardCap}%.
  link: page:/modifiers?kind=max-resist
- term: Immunity
  definition: A monster at 100% or more resistance to a damage type takes no damage of that type; −% Enemy Resist cannot break it; curses, auras and Sunder effects can.
  link: page:/modifiers?kind=enemy-resist
- term: Enemy resist reduction
  definition: 'The "−% to Enemy X Resist" line on gear; lowers the target''s resistance for your damage only, but does nothing against an immune monster.'
  link: page:/modifiers?kind=enemy-resist
- term: Attack rating
  definition: Decides whether attacks hit; ESR's curve gives 50% at {fact:attackRating.curve:pivotRatio} times the target's defense, with no 5% minimum or 95% maximum.
  link: page:/modifiers?kind=attack-rating
- term: Chance to Cast
  definition: An item line that casts a skill at a set level on a trigger, such as on striking, on attack, when struck, on kill or, in ESR, on casting a skill.
  link: page:/modifiers?kind=cast-on-strike
- term: Breakpoint
  definition: The speed value (attack, cast, hit recovery or block) at which an animation gets one frame shorter; speed between breakpoints does nothing. The official Frame Table lists attack and cast breakpoints.
  link: page:/modifiers?kind=fcr
- term: Faster Cast Rate cap
  definition: ESR lets Faster Cast Rate count up to {fact:castRate.cap} instead of vanilla's 200; because of rounding nothing above 480 changes a breakpoint.
  link: page:/modifiers?kind=fcr
- term: Dodge Chance
  definition: ESR's grouped line for Dodge (melee, standing), Avoid (missiles, standing) and Evade (both, while moving); each is capped at {fact:dodge.cap:dodge}%.
  link: page:/modifiers?kind=dodge
- term: Magic Find
  definition: Raises the chance that drops are magic, rare, set or unique, never the number of drops; rare, set and unique get diminishing returns, plus an ESR bonus of {fact:magicFind.tail:unique}% of your raw Magic Find. Items without a rarity (gems, runes, crystals, organs, keys, maps, Worldstone Shards) ignore it.
  link: page:/modifiers?kind=magic-find
- term: Item Quantity
  definition: An ESR stat ("Increased Quantity of Items Found") that adds extra picks from a monster's own drops; 100% is one extra pick. Not on prime evils.
  link: page:/modifiers?kind=extra-items
- term: Skill Cooldown Reduction
  definition: Shortens skill cooldowns; each skill stops at a floor, on most skills 20% of the base cooldown.
  link: page:/modifiers?kind=skill-cooldown
- term: Prime evil
  definition: A monster flagged primeevil in the game files (act bosses, ubers, endgame map bosses and a few others); players and their summons deal only {fact:difficulty.PlayerDamagePercentVSPrimeEvil:nightmare}% damage to them in Nightmare and {fact:difficulty.PlayerDamagePercentVSPrimeEvil:hell}% in Hell. Since 3.3 a launcher plugin makes terror zone heralds count as prime evils and bosses too.
  note: hell-survival
